{% extends "base.html" %}
{% set active = "settings" %}
{% block title %}Настройки 1С{% endblock %}

{% block content %}
<h2>Настройки подключения к 1С</h2>
<p class="subtitle">Параметры подключения к 1С:Предприятие через REST/OData API</p>

<div class="card">
    <h3>Подключение к 1С:Предприятие</h3>
    <div class="form-group">
        <label>URL сервера 1С</label>
        <input type="text" value="http://localhost:8080/1c/odata/standard.odata" placeholder="http://server:port/base/odata/standard.odata">
    </div>
    <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" value="Администратор">
    </div>
    <div class="form-group">
        <label>Пароль</label>
        <input type="password" value="demo1234">
    </div>
    <div class="form-group">
        <label>Информационная база</label>
        <input type="text" value="LegalBase" placeholder="Имя базы">
    </div>
    <br>
    <button class="btn btn-primary" onclick="alert('В прототипе используются демо-данные. В production-версии здесь будет реальное подключение к 1С.')">
        Проверить подключение
    </button>
    <button class="btn btn-outline" onclick="alert('Настройки сохранены (демо)')">
        Сохранить
    </button>
</div>

<div class="card">
    <h3>Настройки отправки претензий</h3>
    <div class="form-group">
        <label>SMTP-сервер</label>
        <input type="text" value="smtp.company.ru" placeholder="smtp.example.com">
    </div>
    <div class="form-group">
        <label>Порт</label>
        <input type="text" value="587">
    </div>
    <div class="form-group">
        <label>Email отправителя</label>
        <input type="email" value="legal@company.ru" placeholder="legal@company.ru">
    </div>
    <br>
    <button class="btn btn-outline" onclick="alert('Настройки сохранены (демо)')">
        Сохранить
    </button>
</div>
{% endblock %}
