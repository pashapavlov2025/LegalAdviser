<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalAdviser — {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1>LegalAdviser</h1>
        <nav>
            <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">
                <span class="icon">&#9776;</span> Проблемы из 1С
            </a>
            <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">
                <span class="icon">&#9881;</span> Настройки 1С
            </a>
        </nav>
        <div class="connection ok">
            <span class="dot"></span> 1С: подключено (демо)
        </div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
